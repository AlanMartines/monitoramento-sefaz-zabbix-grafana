      - uuid: d118c6c4e5624d2f8a931db42b9aab80
        name: '{#AUTORIZADOR}: Status geral (pior serviço)'
        type: DEPENDENT
        key: sefaz.nfe.status[{#AUTORIZADOR},GERAL]
        delay: '0'
        history: 30d
        trends: 365d
        valuemap:
          name: SEFAZ
        description: Pior status entre os 7 serviços (sem o tempo médio). Usado no mapa do Grafana; os alertas continuam por serviço.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.dados['{#AUTORIZADOR}']['GERAL']
          error_handler: DISCARD_VALUE
        master_item:
          key: sefaznfe.py[{$SEFAZ.URL},JSON]
        tags:
        - tag: autorizador
          value: '{#AUTORIZADOR}'
        - tag: servico
          value: Geral
      master_item:
        key: sefaznfe.py[{$SEFAZ.URL},JSON]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
          var d = JSON.parse(value);
          if (!d.dados) {
              throw 'Coleta do portal falhou: ' + (d.erro || 'resposta sem dados');
          }
          return JSON.stringify(Object.keys(d.dados).map(function (k) {
              return {'{#AUTORIZADOR}': k};
          }));
    tags:
    - tag: class
      value: service
    - tag: target
      value: sefaz
    macros:
    - macro: '{$SEFAZ.INTERVALO}'
      value: 1m
      description: Intervalo de leitura do portal.
    - macro: '{$SEFAZ.URL}'
      value: https://www.nfe.fazenda.gov.br/portal/disponibilidade.aspx
      description: Página de disponibilidade da NF-e.
    valuemaps:
    - uuid: 4c3372bdbf1b4db9ba8fc44c1f106c7b
      name: SEFAZ
      mappings:
      - value: '0'
        newvalue: Offline
      - value: '1'
        newvalue: Disponível
      - value: '2'
        newvalue: Indisponível
      - value: '3'
        newvalue: Erro na coleta
      - value: '5'
        newvalue: Sem Dados
    - uuid: bdfc000fd24f49b0bc2f84e392ccbc76
      name: SEFAZ coleta
      mappings:
      - value: '0'
        newvalue: Falha
      - value: '1'
        newvalue: OK
