zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 7fb31f39713b4a7591897d1416ab29b0
    name: Templates/Sefaz
  templates:
  - uuid: 6504cf5030b74ac08735232455d78301
    template: Template_Sefaz_NFe_Portal
    name: Template Sefaz NF-e Portal
    description: |-
      Disponibilidade dos serviços de NF-e (portal nfe.fazenda.gov.br). Um item mestre lê o portal uma vez por intervalo; os autorizadores são descobertos automaticamente.

      Requer o script sefaznfe.py em ExternalScripts.
    vendor:
      name: monitoramento-sefaz-zabbix-grafana
      version: 7.0-1
    groups:
    - name: Templates/Sefaz
    items:
    - uuid: d918c29ad3344f3ebaf09fd3b2dc7e00
      name: 'Sefaz NF-e: dados do portal'
      type: EXTERNAL
      key: sefaznfe.py[{$SEFAZ.URL},JSON]
      delay: '{$SEFAZ.INTERVALO}'
      history: 1d
      value_type: TEXT
      trends: '0'
      timeout: 30s
      description: JSON com o status de todos os autorizadores, gerado por 'sefaznfe.py <URL> JSON'.
      tags:
      - tag: component
        value: coleta
    - uuid: 88350ade108a4b29aca7b83b9c8b63bf
      name: 'Sefaz NF-e: status da coleta'
      type: DEPENDENT
      key: sefaz.nfe.coleta
      delay: '0'
      history: 30d
      trends: 365d
      valuemap:
        name: SEFAZ coleta
      description: 1 quando o portal foi lido com sucesso; 0 quando o script retornou erro.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'return JSON.parse(value).erro ? 0 : 1;'
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: sefaznfe.py[{$SEFAZ.URL},JSON]
      tags:
      - tag: component
        value: coleta
      triggers:
      - uuid: 05de62cb491643f59af03d2711f7e2e2
        name: 'Sefaz NF-e: falha na coleta do portal'
        expression: max(/Template_Sefaz_NFe_Portal/sefaz.nfe.coleta,#3)=0 or nodata(/Template_Sefaz_NFe_Portal/sefaz.nfe.coleta,10m)=1
        priority: AVERAGE
        description: 'O script não conseguiu ler o portal nas 3 últimas execuções, ou parou de enviar dados. Veja o valor do item ''Sefaz NF-e: dados do portal'' ou rode o script com SEFAZ_NFE_DEBUG=1.'
    discovery_rules:
    - uuid: 418836e6c9604e4eb7a68bb59566e103
      name: Autorizadores NF-e
      type: DEPENDENT
      key: sefaz.nfe.autorizadores
      delay: '0'
      lifetime: 30d
      description: Descobre os autorizadores listados no portal (AM, BA, ..., SVRS, SVC-AN, SVC-RS).
      item_prototypes:
      - uuid: a1f7fbf4a5924d2c80ef7213e7a8aab8
        name: '{#AUTORIZADOR}: Autorização'
        type: DEPENDENT
        key: sefaz.nfe.status[{#AUTORIZADOR},AUTORIZACAO]
        delay: '0'
        history: 30d
        trends: 365d
        valuemap:
          name: SEFAZ
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.dados['{#AUTORIZADOR}']['AUTORIZACAO']
          error_handler: DISCARD_VALUE
        master_item:
          key: sefaznfe.py[{$SEFAZ.URL},JSON]
        tags:
        - tag: autorizador
          value: '{#AUTORIZADOR}'
        - tag: servico
          value: Autorização
        trigger_prototypes:
        - uuid: 85098575b29b4b66a0802da2637da823
          expression: count(/Template_Sefaz_NFe_Portal/sefaz.nfe.status[{#AUTORIZADOR},AUTORIZACAO],#3,"eq","0")=3
          name: 'Sefaz NF-e {#AUTORIZADOR}: Autorização offline'
          priority: HIGH
          description: As 3 últimas leituras do portal indicaram vermelho.
          dependencies:
          - name: 'Sefaz NF-e: falha na coleta do portal'
            expression: max(/Template_Sefaz_NFe_Portal/sefaz.nfe.coleta,#3)=0 or nodata(/Template_Sefaz_NFe_Portal/sefaz.nfe.coleta,10m)=1
        - uuid: 680bb6e1319047f9a42ba28478baed53
          expression: count(/Template_Sefaz_NFe_Portal/sefaz.nfe.status[{#AUTORIZADOR},AUTORIZACAO],#3,"eq","2")=3
          name: 'Sefaz NF-e {#AUTORIZADOR}: Autorização instável'
          priority: AVERAGE
          description: As 3 últimas leituras do portal indicaram amarelo.
          dependencies:
          - name: 'Sefaz NF-e: falha na coleta do portal'
            expression: max(/Template_Sefaz_NFe_Portal/sefaz.nfe.coleta,#3)=0 or nodata(/Template_Sefaz_NFe_Portal/sefaz.nfe.coleta,10m)=1
      - uuid: 4e05da1f42c6496bbe66d53a88e56d93
